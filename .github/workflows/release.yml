# Release for tags v*: the full CI (check, unit tests, Playwright on three
# browsers), then a production build published to GitHub Pages.
# Pages source must be "GitHub Actions", and the github-pages environment
# must allow tags v* (see github-settings.md in the spec repository).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: build
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Build
        # vite.config.ts defaults the base to /game/, the Pages project path.
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
